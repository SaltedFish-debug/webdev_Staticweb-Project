<!DOCTYPE html>
<html>
<head>
  <title>Login - Giftrodawn</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #04122b;
      color: #e9f0fc;
      margin: 0;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-top: 0;
    }

    .brand {
      text-align: center;
      padding: 30px 0 10px 0;
      font-size: 22px;
      font-weight: bold;
    }

    .brand span {
      color: #1fa6f2;
    }

    .box {
      width: 320px;
      margin: 20px auto;
      padding: 28px;
      background-color: #0a1d3b;
      border: 1px solid #1b3358;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px;
      margin-bottom: 18px;
      box-sizing: border-box;
      background-color: #081a37;
      border: 1px solid #1b3358;
      border-radius: 5px;
      color: #e9f0fc;
      font-size: 14px;
    }

    input[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #1fa6f2;
      border: none;
      border-radius: 5px;
      color: #04122b;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #44b8f6;
    }
  </style>
</head>

<body>

  <div class="brand">Gift<span>rodawn</span></div>

  <div class="box">
    <h1>Login</h1>

    <form action="index.html" method="get" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" required pattern="admin" title="Wrong username">

      <label for="password">Password</label>
      <input type="password" id="password" required pattern="giftdawn123" title="Wrong password">

      <input type="submit" value="Log in">
    </form>
  </div>

</body>
</html>
