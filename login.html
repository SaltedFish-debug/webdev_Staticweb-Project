<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="main" class="login-main">
    <section class="login-card">
      <div class="login-brand">
        <span class="brand-mark"><i class="bi bi-printer-fill"></i></span>
        <p class="login-brand">Giftrodawn</p>
        <p>Ordering Management System</p>
      </div>

      <h1 class="login-title">Sign In</h1>

      <form action="index.html">

        <div class="mb-3">
          <label for="loginUser" class="form-label">Username</label>
          <input type="text" class="form-control" id="loginUser" placeholder="Enter your username" autocomplete="username" required>
        </div>

        <div class="mb-3">
          <label for="loginPass" class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPass" placeholder="Enter your password" autocomplete="cuurent-password" required>
        </div>

        <button type="submit" class="btn btn-accent w-100">Sign In</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><i class="bi bi-printer-fill"></i> <strong>Giftrodawn</strong> Ordering Management System</p>
      <p class="footer-note">&copy; 2026 Giftrodawn. All rights reserved.</p>
    </div>
  </footer>

</body>

</html>
